<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAD-Messenger Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f5f5f5; padding: 24px; color: #333; }
    h1 { font-size: 20px; margin-bottom: 4px; }
    .sub { color: #888; font-size: 13px; margin-bottom: 20px; }
    .cards { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
    .card { background: #fff; border-radius: 10px; border: 1px solid #e5e5e5;
            padding: 16px 20px; flex: 1; min-width: 140px; }
    .card-label { font-size: 12px; color: #888; margin-bottom: 4px; }
    .card-value { font-size: 24px; font-weight: 500; }
    .chart-box { background: #fff; border-radius: 10px; border: 1px solid #e5e5e5;
                 padding: 20px; margin-bottom: 24px; max-height: 260px; }
    table { width: 100%; border-collapse: collapse; background: #fff;
            border-radius: 10px; overflow: hidden; border: 1px solid #e5e5e5; }
    th { background: #f9f9f9; font-size: 12px; color: #888; padding: 10px 12px;
         text-align: left; border-bottom: 1px solid #eee; }
    td { padding: 10px 12px; font-size: 13px; border-bottom: 1px solid #f0f0f0;
         vertical-align: top; max-width: 200px; word-break: break-word; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 99px;
             font-size: 11px; background: #e8f5e9; color: #2e7d32; }
    #status { color: #aaa; font-size: 13px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <h1>CAD-Messenger Dashboard</h1>
  <div class="sub" id="status">กำลังโหลด...</div>

  <div class="cards">
    <div class="card"><div class="card-label">งานทั้งหมด</div><div class="card-value" id="cnt-total">—</div></div>
    <div class="card"><div class="card-label">วันนี้</div><div class="card-value" id="cnt-today">—</div></div>
    <div class="card"><div class="card-label">ผู้ส่งสูงสุด</div><div class="card-value" id="top-sender" style="font-size:14px;padding-top:6px;">—</div></div>
    <div class="card"><div class="card-label">ผู้รับสูงสุด</div><div class="card-value" id="top-receiver" style="font-size:14px;padding-top:6px;">—</div></div>
  </div>

  <div class="chart-box">
    <canvas id="chart"></canvas>
  </div>

  <table>
    <thead>
      <tr>
        <th>Job ID</th>
        <th>Tracking NO</th>
        <th>Date</th>
        <th>Sender</th>
        <th>Receiver</th>
        <th>Detail</th>
        <th>Timestamp</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <script>
    const API = "วาง_URL_Apps_Script_ตรงนี้";

    fetch(API)
      .then(r => r.json())
      .then(res => {
        const rows = res.data;
        document.getElementById("status").textContent =
          "อัปเดตล่าสุด: " + new Date().toLocaleString("th-TH");

        // --- Summary cards ---
        document.getElementById("cnt-total").textContent = rows.length;

        const today = new Date().toLocaleDateString("th-TH");
        const todayCount = rows.filter(r => {
          const d = new Date(r.Timestamp);
          return d.toLocaleDateString("th-TH") === today;
        }).length;
        document.getElementById("cnt-today").textContent = todayCount;

        const senderMap = {}, receiverMap = {};
        rows.forEach(r => {
          if (r.Sender) senderMap[r.Sender] = (senderMap[r.Sender] || 0) + 1;
          if (r.Receiver) receiverMap[r.Receiver] = (receiverMap[r.Receiver] || 0) + 1;
        });
        const topSender = Object.entries(senderMap).sort((a,b) => b[1]-a[1])[0];
        const topReceiver = Object.entries(receiverMap).sort((a,b) => b[1]-a[1])[0];
        if (topSender) document.getElementById("top-sender").textContent =
          topSender[0] + " (" + topSender[1] + ")";
        if (topReceiver) document.getElementById("top-receiver").textContent =
          topReceiver[0] + " (" + topReceiver[1] + ")";

        // --- Chart: jobs per sender ---
        new Chart(document.getElementById("chart"), {
          type: "bar",
          data: {
            labels: Object.keys(senderMap),
            datasets: [{
              label: "งานต่อผู้ส่ง",
              data: Object.values(senderMap),
              backgroundColor: "#4CAF50"
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
          }
        });

        // --- Table ---
        const tbody = document.getElementById("tbody");
        rows.forEach(r => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td><code style="font-size:11px">${r.Job_ID || ""}</code></td>
            <td>${r.Tracking_NO || ""}</td>
            <td>${r.Date || ""}</td>
            <td>${r.Sender || ""}</td>
            <td>${r.Receiver || ""}</td>
            <td style="white-space:pre-wrap;font-size:12px">${r.Detail || ""}</td>
            <td style="font-size:11px;color:#888">${r.Timestamp || ""}</td>
          `;
          tbody.appendChild(tr);
        });
      })
      .catch(err => {
        document.getElementById("status").textContent = "โหลดไม่สำเร็จ: " + err.message;
      });
  </script>
</body>
</html>
